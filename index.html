<style>
  :root {
    --bg-base: #f7f8fb;
    --surface: #ffffff;
    --border-soft: rgba(15, 23, 42, 0.06);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-tertiary: #94a3b8;
    --pastel-blue: #c7dafc;
    --pastel-blue-strong: #93b6f5;
    --pastel-blue-deep: #5b8def;
    --pastel-purple: #d9c8f7;
    --pastel-purple-strong: #b89cf0;
    --pastel-pink: #f7c8dc;
    --pastel-pink-strong: #ed9ebe;
    --pastel-green: #b9e6c9;
    --pastel-green-strong: #6dc88a;
    --pastel-amber: #f8dcae;
    --pastel-amber-strong: #d4a849;
    --pastel-red: #f5b9b9;
    --pastel-red-strong: #e57878;
  }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    margin: 0;
    color: var(--text-primary);
    background: var(--bg-base);
    background-image:
      radial-gradient(at 8% 0%, rgba(199, 218, 252, 0.45) 0px, transparent 50%),
      radial-gradient(at 92% 6%, rgba(247, 200, 220, 0.35) 0px, transparent 50%),
      radial-gradient(at 50% 100%, rgba(217, 200, 247, 0.30) 0px, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .display-font { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.022em; }
  .ticker { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  .surface {
    background: var(--surface);
    border-radius: 24px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 1px 2px rgba(15,23,42,0.03), 0 8px 24px -12px rgba(15,23,42,0.06);
  }
  .surface-elevated {
    background: var(--surface);
    border-radius: 28px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 1px 2px rgba(15,23,42,0.03), 0 12px 40px -16px rgba(15,23,42,0.10), 0 2px 8px -2px rgba(15,23,42,0.04);
  }
  .glass {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.4);
  }
  .pill { border-radius: 9999px; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fadeup { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .shimmer-text {
    background: linear-gradient(90deg, #5b8def, #b89cf0, #ed9ebe, #b89cf0, #5b8def);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 6s linear infinite;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(15,23,42,0.1); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(15,23,42,0.2); }
  .recharts-cartesian-grid-horizontal line, .recharts-cartesian-grid-vertical line { stroke: rgba(15,23,42,0.05); }
  .recharts-tooltip-wrapper { outline: none !important; }

  .nav-pill {
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-pill:hover { background: rgba(15,23,42,0.04); color: var(--text-primary); }
  .nav-pill.active {
    background: white;
    color: var(--text-primary);
    border: 1px solid var(--border-soft);
    box-shadow: 0 2px 8px rgba(15,23,42,0.06);
  }
  .stat-card {
    padding: 20px 22px;
    border-radius: 22px;
    background: white;
    border: 1px solid var(--border-soft);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -16px rgba(15,23,42,0.12); }
  .stat-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .progress-track {
    height: 8px;
    background: rgba(15,23,42,0.05);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .badge-success { background: #e8f5ee; color: #2d6a47; border: 1px solid #b9e6c9; }
  .badge-warn { background: #fdf6e3; color: #8a6611; border: 1px solid #f8dcae; }
  .badge-danger { background: #fdecec; color: #9a3232; border: 1px solid #f5b9b9; }
  .badge-info { background: #eef4fe; color: #2c5cb8; border: 1px solid #c7dafc; }
  .badge-purple { background: #f3edfb; color: #6b4ea5; border: 1px solid #d9c8f7; }
  .row-hover:hover { background: rgba(199, 218, 252, 0.18); }
  .rank-medal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .rank-1 { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #783c0a; }
  .rank-2 { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #1e293b; }
  .rank-3 { background: linear-gradient(135deg, #fed7aa, #c2410c); color: #6b1d04; }
  .rank-other { background: rgba(15,23,42,0.05); color: var(--text-secondary); }

  .section-divider {
    display: flex; align-items: center; gap: 14px;
    margin: 36px 0 18px 0;
  }
  .section-divider-line { flex:1; height: 1px; background: linear-gradient(90deg, rgba(15,23,42,0.08), transparent); }
  .section-num {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, #5b8def, #b89cf0);
    color: white;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 12px rgba(91,141,239,0.3);
  }

  .insight-card {
    padding: 18px 20px;
    border-radius: 18px;
    background: white;
    border: 1px solid var(--border-soft);
    border-left-width: 4px;
  }
  .insight-success { border-left-color: var(--pastel-green-strong); }
  .insight-warn { border-left-color: var(--pastel-amber-strong); }
  .insight-danger { border-left-color: var(--pastel-red-strong); }
  .insight-info { border-left-color: var(--pastel-blue-deep); }

  .filter-btn {
    padding: 7px 14px;
    border-radius: 11px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    background: white;
    border: 1px solid var(--border-soft);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { border-color: rgba(15,23,42,0.15); }
  .filter-btn.active {
    background: var(--text-primary);
    color: white;
    border-color: var(--text-primary);
  }

  .mini-bar {
    display:inline-block;
    height:6px;
    background: rgba(15,23,42,0.06);
    border-radius: 4px;
    width: 80px;
    position: relative;
    vertical-align: middle;
  }
  .mini-bar-fill {
    position:absolute; left:0; top:0; bottom:0;
    border-radius: 4px;
  }
</style>

// === HELPERS ===
const fmtNumber = (n, dec=0) => (n==null||isNaN(n))?'0':Number(n).toLocaleString('vi-VN',{maximumFractionDigits:dec,minimumFractionDigits:dec});
const fmtCurrency = (n) => {
  if (!n && n !== 0) return '0 ₫';
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(2)+' tỷ';
  if (abs >= 1e6) return (n/1e6).toFixed(1)+' tr';
  if (abs >= 1e3) return (n/1e3).toFixed(0)+'k';
  return fmtNumber(n);
};
const fmtCurrencyFull = (n) => fmtNumber(n)+' ₫';
const fmtPct = (n, dec=1) => (n==null||isNaN(n))?'—':Number(n).toFixed(dec)+'%';

const colorByPct = (p) => {
  if (p >= 100) return '#6dc88a';
  if (p >= 90) return '#5b8def';
  if (p >= 75) return '#d4a849';
  if (p >= 50) return '#ed9ebe';
  return '#e57878';
};

const statusByPct = (p) => {
  if (p >= 100) return { label: 'Đạt mục tiêu', cls: 'badge-success' };
  if (p >= 90) return { label: 'Sát mục tiêu', cls: 'badge-info' };
  if (p >= 75) return { label: 'Khả thi', cls: 'badge-warn' };
  if (p >= 50) return { label: 'Cảnh báo', cls: 'badge-warn' };
  return { label: 'Yếu', cls: 'badge-danger' };
};

// Stat card lớn
const BigStat = ({ accent, label, value, subValue, pct, trend, icon, delay=0 }) => (
  <div className="stat-card fadeup" style={{animationDelay: `${delay}ms`}}>
    <div className="stat-card-accent" style={{background: accent}}></div>
    <div className="flex items-start justify-between mb-3">
      <div className="flex items-center gap-2">
        <div style={{width:34,height:34,borderRadius:11,background:`${accent}22`,color:accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
          {icon}
        </div>
        <div className="text-[12px] font-medium text-slate-500 uppercase tracking-wider">{label}</div>
      </div>
      {trend != null && (
        <span className={`pill ${trend >= 0 ? 'badge-success' : 'badge-danger'}`}>
          {trend >= 0 ? <IconTrendUp size={11}/> : <IconTrendDown size={11}/>}
          {' '}{Math.abs(trend).toFixed(1)}%
        </span>
      )}
    </div>
    <div className="display-font ticker" style={{fontSize:'28px',fontWeight:700,lineHeight:1.1,color:'var(--text-primary)'}}>
      {value}
    </div>
    {subValue && <div className="text-[13px] text-slate-500 mt-1">{subValue}</div>}
    {pct != null && (
      <div className="mt-3">
        <div className="progress-track">
          <div className="progress-fill" style={{width: `${Math.min(pct,100)}%`, background: accent}}></div>
        </div>
        <div className="flex justify-between mt-1.5 text-[11px] text-slate-500">
          <span>Tiến độ</span>
          <span className="font-semibold" style={{color: accent}}>{fmtPct(pct)}</span>
        </div>
      </div>
    )}
  </div>
);

// Section header
const SectionHeader = ({ num, title, subtitle, icon }) => (
  <div className="section-divider">
    <div className="section-num">{num}</div>
    <div>
      <div className="flex items-center gap-2">
        {icon && <span style={{color:'var(--pastel-blue-deep)'}}>{icon}</span>}
        <h2 className="display-font" style={{fontSize:'20px',fontWeight:700,margin:0}}>{title}</h2>
      </div>
      {subtitle && <div className="text-[12px] text-slate-500 mt-0.5">{subtitle}</div>}
    </div>
    <div className="section-divider-line"></div>
  </div>
);

// Tooltip recharts custom
const CustomTooltip = ({ active, payload, label, formatter }) => {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="glass" style={{padding:'10px 14px', borderRadius:12, fontSize:12, minWidth:140}}>
      <div style={{fontWeight:600, marginBottom:6, color:'var(--text-primary)'}}>{label}</div>
      {payload.map((p,i) => (
        <div key={i} style={{display:'flex', justifyContent:'space-between', gap:12, alignItems:'center', marginTop:3}}>
          <span style={{color:p.color, fontWeight:500}}>● {p.name}</span>
          <span style={{fontWeight:600, color:'var(--text-primary)'}} className="ticker">
            {formatter ? formatter(p.value, p.name) : fmtCurrency(p.value)}
          </span>
        </div>
      ))}
    </div>
  );
};

                <div className="progress-track mt-2" style={{height:5}}>
                  <div className="progress-fill" style={{width:`${Math.min(w.pct,120)}%`, background: colorByPct(w.pct)}}></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

// SECTION 2: DỰ BÁO

const Section2 = ({ data }) => {
  const f = data.forecast;
  const o = data.overview;
  const m = data.meta;

  // Tạo data chart dự báo: actual + forecast extension
  const dailyData = data.daily.map(d => ({...d, type:'actual', forecast_base: null, forecast_opt: null, forecast_cons: null}));
  const lastDay = dailyData[dailyData.length-1].day;
  const fcData = [];
  for (let i=1; i<=m.remaining_days; i++) {
    fcData.push({
      day: lastDay+i,
      date: `${String(lastDay+i).padStart(2,'0')}/${String(m.month).padStart(2,'0')}`,
      dt_dat: null,
      dt_mt: null,
      forecast_base: f.last_7_avg,
      forecast_opt: f.last_3_avg,
      forecast_cons: f.last_14_avg,
      type:'forecast'
    });
  }
  // Đường nối: thêm điểm chuyển tiếp
  const lastActual = dailyData[dailyData.length-1];
  if (lastActual) {
    lastActual.forecast_base = lastActual.dt_dat;
    lastActual.forecast_opt = lastActual.dt_dat;
    lastActual.forecast_cons = lastActual.dt_dat;
  }
  const combinedData = [...dailyData, ...fcData];

  return (
    <div>
      <SectionHeader num="2" title="Dự báo doanh số tháng 5/2026"
        subtitle={`Phân tích kết quả thực đạt và dự báo đến hết tháng • Còn ${m.remaining_days} ngày`}
        icon={<IconCrystalBall size={18}/>} />

      {/* 3 KPI dự báo */}
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
        <div className="stat-card fadeup" style={{animationDelay:'0ms'}}>
          <div className="stat-card-accent" style={{background:'#5b8def'}}></div>
          <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Thực đạt</div>
          <div className="display-font ticker" style={{fontSize:24, fontWeight:700}}>{fmtCurrency(o.total_dt_dat)}</div>
          <div className="text-[12px] text-slate-500 mt-1">{m.total_days_complete}/{m.total_days_month} ngày</div>
          <div className="text-[12px] mt-2" style={{color:'var(--pastel-blue-deep)', fontWeight:600}}>
            {fmtPct(o.pct_full)} của mục tiêu cả tháng
          </div>
        </div>

        <div className="stat-card fadeup" style={{animationDelay:'60ms'}}>
          <div className="stat-card-accent" style={{background:'#6dc88a'}}></div>
          <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Dự báo cuối tháng</div>
          <div className="display-font ticker" style={{fontSize:24, fontWeight:700}}>{fmtCurrency(f.fc_base)}</div>
          <div className="text-[12px] text-slate-500 mt-1">Avg 7 ngày × {m.remaining_days} ngày còn lại</div>
          <div className="text-[12px] mt-2" style={{color:'#2d6a47', fontWeight:600}}>
            {fmtPct(f.fc_base_pct)} của mục tiêu cả tháng
          </div>
        </div>

        <div className="stat-card fadeup" style={{animationDelay:'120ms'}}>
          <div className="stat-card-accent" style={{background:'#d4a849'}}></div>
          <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Gap còn lại để đạt MT</div>
          <div className="display-font ticker" style={{fontSize:24, fontWeight:700}}>{fmtCurrency(f.gap_to_target_base)}</div>
          <div className="text-[12px] text-slate-500 mt-1">Chênh lệch dự báo vs MT</div>
          <div className="text-[12px] mt-2" style={{color:'#8a6611', fontWeight:600}}>
            Cần đẩy thêm để đạt 100%

        <div className="stat-card fadeup" style={{animationDelay:'180ms'}}>
          <div className="stat-card-accent" style={{background:'#ed9ebe'}}></div>
          <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-2">Daily target cần đạt</div>
          <div className="display-font ticker" style={{fontSize:24, fontWeight:700}}>{fmtCurrency(f.daily_target_needed)}</div>
          <div className="text-[12px] text-slate-500 mt-1">Bình quân /ngày cho {m.remaining_days} ngày cuối</div>
          <div className="text-[12px] mt-2" style={{color:'#9a3232', fontWeight:600}}>

              <Line type="monotone" dataKey="dt_dat" stroke="#5b8def" name="Thực đạt" strokeWidth={2.5} dot={{r:3}}/>
              <Line type="monotone" dataKey="forecast_base" stroke="#6dc88a" name="Dự báo (base)" strokeWidth={2.5} strokeDasharray="6 4" dot={false}/>
              <Line type="monotone" dataKey="forecast_opt" stroke="#b89cf0" name="Lạc quan" strokeWidth={1.8} strokeDasharray="3 3" dot={false}/>
              <Line type="monotone" dataKey="forecast_cons" stroke="#ed9ebe" name="Thận trọng" strokeWidth={1.8} strokeDasharray="3 3" dot={false}/>
            </ComposedChart>
          </ResponsiveContainer>
        </div>

        <div className="space-y-4 fadeup" style={{animationDelay:'300ms'}}>
          <div className="display-font font-bold text-[15px] mb-1">3 kịch bản dự báo</div>

          {/* Lạc quan */}
          <div className="surface p-4">

            <div className="text-[12px] text-slate-500">{fmtPct(f.fc_optimistic_pct)} mục tiêu</div>
            <div className="progress-track mt-2"><div className="progress-fill" style={{width:`${Math.min(f.fc_optimistic_pct,100)}%`, background:'#b89cf0'}}></div></div>
          </div>

          {/* Base */}
          <div className="surface p-4" style={{borderColor:'#6dc88a', borderWidth:2}}>

            </div>
            <div className="ticker font-bold text-[18px] mt-1 display-font">{fmtCurrency(f.fc_base)}</div>
            <div className="text-[12px] text-slate-500">{fmtPct(f.fc_base_pct)} mục tiêu</div>
            <div className="progress-track mt-2"><div className="progress-fill" style={{width:`${Math.min(f.fc_base_pct,100)}%`, background:'#6dc88a'}}></div></div>

          {/* Thận trọng */}

            <div className="flex justify-between items-start mb-1">
              <div className="flex items-center gap-2">
                <span className="pill badge-warn">Thận trọng</span>
              </div>
              <span className="text-[11px] text-slate-500">Avg 14 ngày gần</span>
            </div>
            <div className="ticker font-bold text-[18px] mt-1 display-font">{fmtCurrency(f.fc_conservative)}</div>
            <div className="text-[12px] text-slate-500">{fmtPct(f.fc_conservative_pct)} mục tiêu</div>
            <div className="progress-track mt-2"><div className="progress-fill" style={{width:`${Math.min(f.fc_conservative_pct,100)}%`, background:'#d4a849'}}></div></div>

      </div>

      {/* Bảng so sánh */}
      <div className="surface p-5 mt-5 fadeup" style={{animationDelay:'360ms'}}>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div className="p-4 rounded-2xl" style={{background:'rgba(199,218,252,0.15)'}}>
            <div className="text-[11px] uppercase font-semibold text-slate-500">So với tháng 4 cùng kỳ</div>
            <div className="ticker font-bold display-font text-[20px] mt-1" style={{color: o.mom_growth>=0?'#2d6a47':'#9a3232'}}>

// SECTION 3: CHI TIẾT VÙNG & CỬA HÀNG
// =================
const Section3 = ({ data }) => {
  const [selectedRegion, setSelectedRegion] = useState('all');
  const [search, setSearch] = useState('');

  const filteredStores = useMemo(() => {
    let s = data.stores;
    if (selectedRegion !== 'all') s = s.filter(x => x.vung === selectedRegion);
    if (search) s = s.filter(x => x.name.toLowerCase().includes(search.toLowerCase()));
    return s;
  }, [data.stores, selectedRegion, search]);

  const regionPalette = ['#5b8def','#b89cf0','#ed9ebe','#6dc88a','#d4a849','#e57878'];

  return (
    <div>
      <SectionHeader num="3" title="Chi tiết theo khu vực & cửa hàng"
        subtitle="Phân tích sâu hiệu quả theo vùng và từng chi nhánh"
        icon={<IconMap size={18}/>} />

      {/* Vùng cards */}
      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mt-4">
        {data.regions.map((r,i) => (
          <div key={i} className="stat-card cursor-pointer fadeup" style={{animationDelay:`${i*50}ms`}}
               onClick={() => setSelectedRegion(selectedRegion === r.name ? 'all' : r.name)}>
            <div className="stat-card-accent" style={{background: regionPalette[i % regionPalette.length]}}></div>
            <div className="flex justify-between items-start mb-2">
              <div className="text-[11px] text-slate-500 font-semibold uppercase tracking-wider">{r.name}</div>
              <span className={`pill ${statusByPct(r.pct).cls}`} style={{fontSize:10, padding:'3px 7px'}}>{fmtPct(r.pct,0)}</span>
            </div>
            <div className="ticker display-font font-bold text-[18px]">{fmtCurrency(r.dt_dat)}</div>
            <div className="text-[11px] text-slate-500 mt-0.5">MT: {fmtCurrency(r.dt_mt)}</div>
            <div className="progress-track mt-2" style={{height:5}}>
              <div className="progress-fill" style={{width:`${Math.min(r.pct,120)}%`, background: colorByPct(r.pct)}}></div>
            </div>
            <div className="flex justify-between mt-2 text-[11px] text-slate-500">
              <span>{r.so_ch} cửa hàng</span>
              <span>{fmtNumber(r.don)} đơn</span>
            </div>
          </div>
        ))}
      </div>

      {/* Biểu đồ vùng so sánh + radar/scatter */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-5">
        <div className="surface p-5 fadeup" style={{animationDelay:'300ms'}}>
          <div className="display-font font-bold text-[16px] mb-1">So sánh hiệu quả các vùng</div>
          <div className="text-[12px] text-slate-500 mb-4">Doanh thu đạt vs mục tiêu</div>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={data.regions} layout="vertical" margin={{top:5,right:20,left:0,bottom:0}}>
              <CartesianGrid strokeDasharray="3 3" horizontal={false}/>
              <XAxis type="number" fontSize={10} stroke="#94a3b8" tickFormatter={(v)=>fmtCurrency(v)}/>
              <YAxis type="category" dataKey="name" fontSize={11} stroke="#94a3b8" width={90}/>
              <Tooltip content={<CustomTooltip/>}/>
              <Bar dataKey="dt_mt" fill="#cbd5e1" name="Mục tiêu" radius={[0,4,4,0]} barSize={12} opacity={0.5}/>
              <Bar dataKey="dt_dat" fill="#5b8def" name="Đạt" radius={[0,4,4,0]} barSize={12}>
                {data.regions.map((r, i) => <Cell key={i} fill={colorByPct(r.pct)} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>

        <div className="surface p-5 fadeup" style={{animationDelay:'360ms'}}>
          <div className="display-font font-bold text-[16px] mb-1">Phân bố doanh thu theo vùng</div>
          <div className="text-[12px] text-slate-500 mb-4">% đóng góp vào tổng doanh thu</div>
          <ResponsiveContainer width="100%" height={260}>
            <PieChart>
              <Pie data={data.regions} dataKey="dt_dat" nameKey="name" cx="50%" cy="50%"
                   innerRadius={55} outerRadius={95} paddingAngle={2} labelLine={false}
                   label={({name, percent}) => `${(percent*100).toFixed(0)}%`}>
                {data.regions.map((r, i) => <Cell key={i} fill={regionPalette[i % regionPalette.length]} />)}
              </Pie>
              <Tooltip content={<CustomTooltip/>}/>
              <Legend iconType="circle" wrapperStyle={{fontSize:11}}/>
            </PieChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Bảng cửa hàng chi tiết */}
      <div className="surface p-5 mt-5 fadeup" style={{animationDelay:'420ms'}}>
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
          <div>
            <div className="display-font font-bold text-[16px]">Chi tiết từng cửa hàng</div>
            <div className="text-[12px] text-slate-500">{filteredStores.length} cửa hàng • Lọc theo vùng và tìm kiếm</div>
          </div>
          <div className="flex gap-2 flex-wrap items-center">
            <input type="text" placeholder="Tìm cửa hàng..." value={search} onChange={e=>setSearch(e.target.value)}
                   style={{padding:'8px 14px', border:'1px solid var(--border-soft)', borderRadius:11,
                           fontSize:13, outline:'none', width:200, background:'white'}} />
          </div>
        </div>

        <div className="flex gap-1.5 flex-wrap mb-4">
          <button onClick={()=>setSelectedRegion('all')} className={`filter-btn ${selectedRegion==='all'?'active':''}`}>Tất cả</button>
          {data.regions.map(r => (
            <button key={r.name} onClick={()=>setSelectedRegion(r.name)} className={`filter-btn ${selectedRegion===r.name?'active':''}`}>{r.name}</button>
          ))}
        </div>

        <div style={{maxHeight:520, overflowY:'auto'}}>
          <table className="w-full text-[12.5px]">
            <thead style={{position:'sticky', top:0, background:'white', zIndex:2}}>
              <tr style={{borderBottom:'1px solid var(--border-soft)'}}>
                <th className="text-left py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">#</th>
                <th className="text-left py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">Cửa hàng</th>
                <th className="text-left py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">Vùng</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">DT đạt</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">DT MT</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">% HT</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">Đơn</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">Traffic</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">ATV</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">CRV</th>
                <th className="text-right py-2.5 px-2 font-semibold text-slate-500 text-[11px] uppercase tracking-wider">UPT</th>
              </tr>
            </thead>
            <tbody>
              {filteredStores.map((s, i) => (
                <tr key={s.name} className="row-hover" style={{borderBottom:'1px solid rgba(15,23,42,0.04)'}}>
                  <td className="py-2.5 px-2 text-slate-500 font-semibold">{i+1}</td>
                  <td className="py-2.5 px-2 font-medium">{s.name.replace('GUMAC-','').replace('GUMAC ','').trim()}</td>
                  <td className="py-2.5 px-2">
                    <span className="pill badge-info" style={{fontSize:10, padding:'2px 8px'}}>{s.vung}</span>
                  </td>
                  <td className="py-2.5 px-2 text-right ticker font-semibold">{fmtCurrency(s.dt_dat)}</td>
                  <td className="py-2.5 px-2 text-right ticker text-slate-500">{fmtCurrency(s.dt_mt)}</td>
                  <td className="py-2.5 px-2 text-right">
                    <span style={{color: colorByPct(s.pct), fontWeight:600}} className="ticker">{fmtPct(s.pct,1)}</span>
                  </td>
                  <td className="py-2.5 px-2 text-right ticker">{fmtNumber(s.don)}</td>
                  <td className="py-2.5 px-2 text-right ticker">{fmtNumber(s.traffic)}</td>
                  <td className="py-2.5 px-2 text-right ticker">{fmtCurrency(s.atv)}</td>
                  <td className="py-2.5 px-2 text-right ticker">{s.crv.toFixed(0)}%</td>
                  <td className="py-2.5 px-2 text-right ticker">{s.upt.toFixed(1)}</td>
                </tr>
              ))}
              {filteredStores.length === 0 && (
                <tr><td colSpan="11" className="text-center py-8 text-slate-400">Không có cửa hàng phù hợp</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

const Section4 = ({ data }) => {
  const sortedByPct = [...data.stores].sort((a,b) => b.pct - a.pct);
  const top5 = sortedByPct.slice(0, 5);
  const bottom5 = sortedByPct.slice(-5).reverse();

  // Top theo doanh thu tuyệt đối
  const sortedByDT = [...data.stores].sort((a,b) => b.dt_dat - a.dt_dat).slice(0, 10);

  const RankCard = ({ store, idx, type='top' }) => {
    const isTop = type === 'top';
    const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-other';
    return (
      <div className="p-3.5 rounded-2xl" style={{background: isTop ? 'rgba(185,230,201,0.18)' : 'rgba(245,185,185,0.15)',
                                                  border: `1px solid ${isTop?'rgba(109,200,138,0.3)':'rgba(229,120,120,0.3)'}`}}>
        <div className="flex items-center gap-3">
          <div className={`rank-medal ${rankClass}`}>{idx+1}</div>
          <div className="flex-1 min-w-0">
            <div className="font-semibold text-[13px] truncate">{store.name.replace('GUMAC-','').replace('GUMAC ','').trim()}</div>
            <div className="text-[11px] text-slate-500">{store.vung} • {store.loai}</div>
          </div>
          <div className="text-right">
            <div className="ticker font-bold display-font text-[15px]" style={{color: colorByPct(store.pct)}}>{fmtPct(store.pct,1)}</div>
            <div className="text-[11px] text-slate-500 ticker">{fmtCurrency(store.dt_dat)}</div>
          </div>
        </div>
        <div className="progress-track mt-2" style={{height:5}}>
          <div className="progress-fill" style={{width:`${Math.min(store.pct,120)}%`, background: colorByPct(store.pct)}}></div>
        </div>
      </div>
    );
  };

  return (
    <div>
      <SectionHeader num="4" title="Xếp hạng cửa hàng" subtitle="Top dẫn đầu, nhóm cần hỗ trợ và phân loại sức khỏe vận hành"
        icon={<IconTrophy size={18}/>} />

      {/* Top & Bottom 5 */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-4">
        <div className="surface p-5 fadeup" style={{animationDelay:'0ms'}}>
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">
              <div style={{width:32,height:32,borderRadius:10,background:'#e8f5ee',color:'#2d6a47',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <IconTrophy size={16}/>
              </div>
              <div>
                <div className="display-font font-bold text-[16px]">Top 5 dẫn đầu</div>
                <div className="text-[11px] text-slate-500">% hoàn thành mục tiêu cao nhất</div>
              </div>
            </div>
          </div>
          <div className="space-y-2.5">
            {top5.map((s,i) => <RankCard key={s.name} store={s} idx={i} type="top"/>)}
          </div>
        </div>

        <div className="surface p-5 fadeup" style={{animationDelay:'120ms'}}>
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">
              <div style={{width:32,height:32,borderRadius:10,background:'#fdecec',color:'#9a3232',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <IconAlert size={16}/>
              </div>
              <div>
                <div className="display-font font-bold text-[16px]">Top 5 cần hỗ trợ</div>
                <div className="text-[11px] text-slate-500">% hoàn thành thấp nhất</div>
              </div>
            </div>
          </div>
          <div className="space-y-2.5">
            {bottom5.map((s,i) => <RankCard key={s.name} store={s} idx={i} type="bottom"/>)}
          </div>
        </div>
      </div>

      {/* Top 10 doanh thu tuyệt đối */}
      <div className="surface p-5 mt-5 fadeup" style={{animationDelay:'240ms'}}>
        <div className="flex items-center justify-between mb-4">
          <div>
            <div className="display-font font-bold text-[16px]">Top 10 cửa hàng theo doanh thu tuyệt đối</div>
            <div className="text-[12px] text-slate-500">Đóng góp doanh thu lớn nhất tháng 5/2026</div>
          </div>
        </div>
        <ResponsiveContainer width="100%" height={320}>
          <BarChart data={sortedByDT} layout="vertical" margin={{top:5,right:30,left:0,bottom:0}}>
            <CartesianGrid strokeDasharray="3 3" horizontal={false}/>
            <XAxis type="number" fontSize={10} stroke="#94a3b8" tickFormatter={(v)=>fmtCurrency(v)}/>
            <YAxis type="category" dataKey="name" fontSize={10} stroke="#475569" width={180}
                   tickFormatter={(v) => v.replace('GUMAC-','').replace('GUMAC ','').trim().slice(0,28)}/>
            <Tooltip content={<CustomTooltip/>}/>
            <Bar dataKey="dt_dat" fill="#5b8def" name="Doanh thu đạt" radius={[0,4,4,0]} barSize={16}>
              {sortedByDT.map((s, i) => <Cell key={i} fill={colorByPct(s.pct)} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>

      {/* Phân loại sức khỏe vận hành B1-B8 */}
      <div className="surface p-5 mt-5 fadeup" style={{animationDelay:'300ms'}}>
        <div className="mb-4">
          <div className="display-font font-bold text-[16px]">Phân loại sức khỏe vận hành</div>
          <div className="text-[12px] text-slate-500">Dựa trên 3 trục: Traffic, CRV (chốt đơn), ATV (giá trị đơn)</div>
        </div>

        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          {[
            {g:'B1', label:'Xuất sắc', color:'#6dc88a', bg:'#e8f5ee'},
            {g:'B2', label:'Thiếu ATV', color:'#d4a849', bg:'#fdf6e3'},
            {g:'B3', label:'Chốt đơn yếu', color:'#e57878', bg:'#fdecec'},
            {g:'B4', label:'Chuyển đổi yếu', color:'#e57878', bg:'#fdecec'},
            {g:'B5', label:'Thiếu Traffic', color:'#d4a849', bg:'#fdf6e3'},
            {g:'B6', label:'2 mặt yếu', color:'#e57878', bg:'#fdecec'},
            {g:'B7', label:'Chỉ bán cao giá', color:'#e57878', bg:'#fdecec'},
            {g:'B8', label:'Báo động', color:'#c95757', bg:'#fce0e0'},
          ].map(g => {
            const cnt = data.stores.filter(s => s.group === g.g).length;
            return (
              <div key={g.g} className="p-3 rounded-2xl" style={{background: g.bg, borderLeft:`4px solid ${g.color}`}}>
                <div className="flex justify-between items-start">
                  <span className="text-[10px] font-bold text-slate-500">{g.g}</span>
                  <span className="ticker font-bold display-font text-[18px]" style={{color: g.color}}>{cnt}</span>
                </div>
                <div className="text-[11.5px] font-semibold mt-1" style={{color: g.color}}>{g.label}</div>
              </div>
            );
          })}
        </div>

        <div style={{maxHeight: 360, overflowY:'auto'}}>
          <table className="w-full text-[12px]">
            <thead style={{position:'sticky', top:0, background:'white'}}>
              <tr style={{borderBottom:'1px solid var(--border-soft)'}}>
                <th className="text-left py-2 px-2 font-semibold text-slate-500 text-[10px] uppercase tracking-wider">Nhóm</th>
                <th className="text-left py-2 px-2 font-semibold text-slate-500 text-[10px] uppercase tracking-wider">Cửa hàng</th>
                <th className="text-left py-2 px-2 font-semibold text-slate-500 text-[10px] uppercase tracking-wider">Vùng</th>
                <th className="text-right py-2 px-2 font-semibold text-slate-500 text-[10px] uppercase tracking-wider">Traffic</th>
                <th className="text-right py-2 px-2 font-semibold text-slate-500 text-[10px] uppercase tracking-wider">CRV</th>
                <th className="text-right py-2 px-2 font-semibold text-slate-500 text-[10px] uppercase tracking-wider">ATV</th>
                <th className="text-right py-2 px-2 font-semibold text-slate-500 text-[10px] uppercase tracking-wider">% HT</th>
              </tr>
            </thead>
            <tbody>
              {[...data.stores].sort((a,b) => a.group.localeCompare(b.group)).map((s) => {
                const groupColor = {
                  B1:'#6dc88a', B2:'#d4a849', B3:'#e57878', B4:'#e57878',
                  B5:'#d4a849', B6:'#e57878', B7:'#e57878', B8:'#c95757'
                }[s.group];
                return (
                  <tr key={s.name} className="row-hover" style={{borderBottom:'1px solid rgba(15,23,42,0.04)'}}>
                    <td className="py-2 px-2"><span className="pill" style={{background:`${groupColor}22`, color:groupColor, fontSize:10, padding:'2px 8px'}}>{s.group} • {s.group_label}</span></td>
                    <td className="py-2 px-2 font-medium">{s.name.replace('GUMAC-','').replace('GUMAC ','').trim()}</td>
                    <td className="py-2 px-2 text-slate-500">{s.vung}</td>
                    <td className="py-2 px-2 text-right ticker">{fmtPct(s.traffic_pct,0)}</td>
                    <td className="py-2 px-2 text-right ticker">{s.crv.toFixed(0)}% / {s.crv_mt.toFixed(0)}%</td>
                    <td className="py-2 px-2 text-right ticker">{fmtCurrency(s.atv)}</td>
                    <td className="py-2 px-2 text-right ticker font-semibold" style={{color: colorByPct(s.pct)}}>{fmtPct(s.pct,1)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

// =================
// SECTION 5: NHẬN ĐỊNH & ĐỀ XUẤT
// =================
const Section5 = ({ data }) => {
  const o = data.overview;
  const f = data.forecast;
  const m = data.meta;

  // Tự động sinh insights từ data
  const top1 = [...data.stores].sort((a,b) => b.pct - a.pct)[0];
  const bottom1 = [...data.stores].filter(s => s.pct < 60).sort((a,b) => a.pct - b.pct);
  const bestRegion = [...data.regions].sort((a,b) => b.pct - a.pct)[0];
  const worstRegion = [...data.regions].sort((a,b) => a.pct - b.pct)[0];
  const b8Stores = data.stores.filter(s => s.group === 'B8');
  const b1Stores = data.stores.filter(s => s.group === 'B1');

  return (
    <div>
      <SectionHeader num="5" title="Nhận định chung & Đề xuất" subtitle="Tổng kết tình hình kinh doanh và hành động ưu tiên"
        icon={<IconLightbulb size={18}/>} />

      {/* Tổng kết tình hình */}
      <div className="surface-elevated p-6 mt-4 fadeup" style={{animationDelay:'0ms'}}>
        <div className="flex items-start gap-4">
          <div style={{width:48,height:48,borderRadius:14,background:'linear-gradient(135deg,#c7dafc,#d9c8f7)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <IconLightbulb size={24}/>
          </div>
          <div className="flex-1">
            <div className="display-font font-bold text-[18px] mb-2">Bức tranh tổng thể tháng 5/2026</div>
            <p className="text-[13.5px] text-slate-600 leading-relaxed">
              Sau {m.total_days_complete}/{m.total_days_month} ngày, GUMAC đã ghi nhận doanh thu <strong className="text-slate-800">{fmtCurrencyFull(o.total_dt_dat)}</strong>,
              hoàn thành <strong style={{color: colorByPct(o.pct_to_date)}}>{fmtPct(o.pct_to_date)}</strong> mục tiêu lũy kế và{' '}
              <strong style={{color: colorByPct(o.pct_full)}}>{fmtPct(o.pct_full)}</strong> mục tiêu cả tháng.
              Tăng trưởng <strong style={{color: o.mom_growth>=0?'#2d6a47':'#9a3232'}}>{o.mom_growth>=0?'+':''}{o.mom_growth.toFixed(1)}%</strong> so với tháng 4 cùng kỳ
              cho thấy động lực kinh doanh đang đi đúng hướng. Với tốc độ hiện tại, dự báo cuối tháng đạt{' '}
              <strong className="text-slate-800">{fmtCurrency(f.fc_base)}</strong> (<strong style={{color: colorByPct(f.fc_base_pct)}}>{fmtPct(f.fc_base_pct)}</strong> mục tiêu).
              Còn <strong className="text-slate-800">{m.remaining_days} ngày</strong> để{' '}
              {f.fc_base_pct >= 98 ? 'duy trì đà tăng trưởng' : f.fc_base_pct >= 92 ? 'tăng tốc và rút ngắn khoảng cách với mục tiêu' : 'triển khai các giải pháp mạnh tay'}.
            </p>
          </div>
        </div>

        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">
          <div className="p-3 rounded-2xl" style={{background:'rgba(185,230,201,0.20)'}}>
            <div className="text-[11px] text-slate-500 font-semibold uppercase">Cửa hàng đạt mục tiêu</div>
            <div className="ticker display-font font-bold text-[20px]" style={{color:'#2d6a47'}}>{data.stores.filter(s=>s.pct>=100).length}</div>
            <div className="text-[11px] text-slate-500">/{data.stores.length} cửa hàng</div>
          </div>
          <div className="p-3 rounded-2xl" style={{background:'rgba(199,218,252,0.20)'}}>
            <div className="text-[11px] text-slate-500 font-semibold uppercase">Sát mục tiêu (90-100%)</div>
            <div className="ticker display-font font-bold text-[20px]" style={{color:'var(--pastel-blue-deep)'}}>{data.stores.filter(s=>s.pct>=90 && s.pct<100).length}</div>
            <div className="text-[11px] text-slate-500">cần đẩy thêm</div>
          </div>
          <div className="p-3 rounded-2xl" style={{background:'rgba(248,220,174,0.25)'}}>
            <div className="text-[11px] text-slate-500 font-semibold uppercase">Cảnh báo (60-90%)</div>
            <div className="ticker display-font font-bold text-[20px]" style={{color:'#8a6611'}}>{data.stores.filter(s=>s.pct>=60 && s.pct<90).length}</div>
            <div className="text-[11px] text-slate-500">cần hỗ trợ</div>
          </div>
          <div className="p-3 rounded-2xl" style={{background:'rgba(245,185,185,0.25)'}}>
            <div className="text-[11px] text-slate-500 font-semibold uppercase">Báo động (&lt;60%)</div>
            <div className="ticker display-font font-bold text-[20px]" style={{color:'#9a3232'}}>{data.stores.filter(s=>s.pct<60).length}</div>
            <div className="text-[11px] text-slate-500">cần can thiệp</div>
          </div>
        </div>
      </div>

      {/* Insights */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5">
        <div className="insight-card insight-success fadeup" style={{animationDelay:'60ms'}}>
          <div className="flex items-center gap-2 mb-2">
            <IconCheck size={16} className="text-green-700"/>
            <div className="font-semibold text-[13px]">Điểm sáng</div>
          </div>
          <ul className="text-[12.5px] text-slate-700 space-y-1.5 ml-1">
            <li>• Vùng <strong>{bestRegion.name}</strong> dẫn đầu với <strong>{fmtPct(bestRegion.pct)}</strong> ({bestRegion.so_ch} CH)</li>
            <li>• Cửa hàng <strong>{top1.name.replace('GUMAC-','').replace('GUMAC ','').trim()}</strong> hoàn thành <strong>{fmtPct(top1.pct)}</strong></li>
            <li>• Tăng trưởng <strong>+{o.mom_growth.toFixed(1)}%</strong> so với tháng 4 cùng kỳ — đà tích cực</li>
            <li>• Có <strong>{b1Stores.length} cửa hàng nhóm B1</strong> (Traffic ✓ CRV ✓ ATV ✓) — mô hình tốt để nhân rộng</li>
            <li>• Traffic đạt <strong>{fmtPct(o.traffic_pct)}</strong> mục tiêu — sức hút thương hiệu mạnh</li>
          </ul>
        </div>

        <div className="insight-card insight-warn fadeup" style={{animationDelay:'120ms'}}>
          <div className="flex items-center gap-2 mb-2">
            <IconAlert size={16} style={{color:'#8a6611'}}/>
            <div className="font-semibold text-[13px]">Điểm cần lưu ý</div>
          </div>
          <ul className="text-[12.5px] text-slate-700 space-y-1.5 ml-1">
            <li>• Vùng <strong>{worstRegion.name}</strong> chỉ đạt <strong>{fmtPct(worstRegion.pct)}</strong> — cần ưu tiên xử lý</li>
            <li>• ATV trung bình <strong>{fmtCurrency(o.avg_atv)}</strong> và UPT <strong>{o.avg_upt.toFixed(2)}</strong> — còn dư địa upsell</li>
            <li>• CRV trung bình <strong>{o.avg_crv.toFixed(1)}%</strong> — có khoảng cách so với mục tiêu thường 85%</li>
            <li>• <strong>{data.stores.filter(s=>s.group==='B2' || s.group==='B5').length} CH</strong> ở nhóm B2/B5 — vận hành ổn nhưng cần đẩy traffic hoặc ATV</li>
            <li>• Daily avg cần đạt: <strong>{fmtCurrency(f.daily_target_needed)}</strong>, cao hơn hiện tại {fmtPct((f.daily_target_needed/f.last_7_avg-1)*100,1)}</li>
          </ul>
        </div>

        <div className="insight-card insight-danger fadeup" style={{animationDelay:'180ms'}}>
          <div className="flex items-center gap-2 mb-2">
            <IconAlert size={16} className="text-red-700"/>
            <div className="font-semibold text-[13px]">Báo động — cần can thiệp ngay</div>
          </div>
          <ul className="text-[12.5px] text-slate-700 space-y-1.5 ml-1">
            {bottom1.slice(0,4).map(s => (
              <li key={s.name}>• <strong>{s.name.replace('GUMAC-','').replace('GUMAC ','').trim()}</strong> ({s.vung}): chỉ {fmtPct(s.pct)} — nhóm {s.group} ({s.group_label})</li>
            ))}
            {b8Stores.length > 0 && (
              <li className="pt-1.5 border-t border-red-200"><strong>{b8Stores.length} CH nhóm B8</strong> — cả 3 trục Traffic/CRV/ATV đều yếu, cần kế hoạch đặc biệt</li>
            )}
          </ul>
        </div>

        <div className="insight-card insight-info fadeup" style={{animationDelay:'240ms'}}>
          <div className="flex items-center gap-2 mb-2">
            <IconCrystalBall size={16} style={{color:'var(--pastel-blue-deep)'}}/>
            <div className="font-semibold text-[13px]">Dự báo cuối tháng</div>
          </div>
          <ul className="text-[12.5px] text-slate-700 space-y-1.5 ml-1">
            <li>• Kịch bản <strong>cơ sở</strong>: {fmtCurrency(f.fc_base)} (<strong>{fmtPct(f.fc_base_pct)}</strong> MT)</li>
            <li>• Kịch bản <strong>lạc quan</strong>: {fmtCurrency(f.fc_optimistic)} ({fmtPct(f.fc_optimistic_pct)} MT)</li>
            <li>• Kịch bản <strong>thận trọng</strong>: {fmtCurrency(f.fc_conservative)} ({fmtPct(f.fc_conservative_pct)} MT)</li>
            <li>• Khoảng cách đến MT (kịch bản cơ sở): <strong>{fmtCurrency(f.gap_to_target_base)}</strong></li>
            <li>• Để chạm 100%, cần đẩy bình quân <strong>{fmtCurrency(f.daily_target_needed)}/ngày</strong> trong {m.remaining_days} ngày cuối</li>
          </ul>
        </div>
      </div>

      {/* Đề xuất hành động */}
      <div className="surface-elevated p-6 mt-5 fadeup" style={{animationDelay:'300ms'}}>
        <div className="flex items-center gap-3 mb-4">
          <div style={{width:40,height:40,borderRadius:12,background:'linear-gradient(135deg,#5b8def,#b89cf0)',color:'white',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <IconArrowRight size={20}/>
          </div>
          <div>
            <div className="display-font font-bold text-[17px]">Đề xuất hành động trong {m.remaining_days} ngày cuối</div>
            <div className="text-[12px] text-slate-500">Ưu tiên theo mức độ tác động lên doanh số tổng</div>
          </div>
        </div>

        <div className="space-y-3 mt-4">
          {[
            {
              icon:'🎯', color:'#5b8def', bg:'#eef4fe', title:'Ưu tiên 1 — Đẩy mạnh marketing cho vùng dẫn đầu',
              desc:`Vùng ${bestRegion.name} đang chạy tốt (${fmtPct(bestRegion.pct)}). Tăng ngân sách ads 15-20% để gia cố doanh thu chắc chắn. Đặc biệt các CH nhóm B1 — chạy retargeting, push Zalo OA, livestream để khai thác tối đa traffic sẵn có.`
            },
            {
              icon:'🚀', color:'#6dc88a', bg:'#e8f5ee', title:'Ưu tiên 2 — Tăng ATV cho nhóm B2 & B5',
              desc:`${data.stores.filter(s=>s.group==='B2'||s.group==='B5').length} cửa hàng có vận hành tốt nhưng thiếu ATV hoặc Traffic. Triển khai combo "Mua kèm tiết kiệm", voucher cross-sell, đào tạo upsell tại quầy. Riêng B5: tăng ads geo-targeting bán kính 3-5km, hợp tác KOL/KOC địa phương.`
            },
            {
              icon:'⚡', color:'#d4a849', bg:'#fdf6e3', title:`Ưu tiên 3 — Xử lý ${worstRegion.name} và các CH dưới 70%`,
              desc:`Vùng ${worstRegion.name} chỉ đạt ${fmtPct(worstRegion.pct)} — cần audit cấp tốc. Với các CH nhóm B3/B4 (chốt đơn yếu): tập trung đào tạo kỹ năng tư vấn, kịch bản chốt đơn, flash sale giờ vàng. Triển khai retargeting khách đã ghé store nhưng chưa mua.`
            },
            {
              icon:'🚨', color:'#e57878', bg:'#fdecec', title:'Ưu tiên 4 — Kế hoạch đặc biệt cho nhóm B8 (báo động)',
              desc:b8Stores.length > 0
                ? `${b8Stores.length} cửa hàng nhóm B8: ${b8Stores.slice(0,3).map(s=>s.name.replace('GUMAC-','').replace('GUMAC ','').trim()).join(', ')}${b8Stores.length>3?'...':''}. STOP ads thường, FIX vận hành (nhân sự, layout, sản phẩm) trước. Sau đó relaunch như cửa hàng mới với grand opening + boost ads 2 tuần đầu. Đánh giá lại sau 2 tháng.`
                : 'Không có cửa hàng nào ở mức báo động — tiếp tục duy trì.'
            },
            {
              icon:'📊', color:'#b89cf0', bg:'#f3edfb', title:'Ưu tiên 5 — Tận dụng cuối tuần & lễ',
              desc:`Phân tích dữ liệu cho thấy doanh thu cuối tuần (T7-CN) thường cao 1.5-2x ngày thường. ${m.remaining_days} ngày cuối tháng còn 1-2 cuối tuần — chuẩn bị campaign "Tổng kết tháng — Giảm giá đặc biệt", đẩy livestream cuối tuần, voucher hạn dùng đến 31/5 để tạo urgency.`
            },
          ].map((item, i) => (
            <div key={i} className="p-4 rounded-2xl flex gap-3" style={{background: item.bg, borderLeft:`4px solid ${item.color}`}}>
              <div className="text-[22px]">{item.icon}</div>
              <div className="flex-1">
                <div className="font-semibold text-[14px] mb-1" style={{color: item.color}}>{item.title}</div>
                <p className="text-[12.5px] text-slate-700 leading-relaxed">{item.desc}</p>
              </div>
            </div>
          ))}
        </div>

        <div className="mt-5 p-4 rounded-2xl" style={{background:'linear-gradient(135deg, rgba(199,218,252,0.3), rgba(217,200,247,0.3))', border:'1px solid rgba(91,141,239,0.2)'}}>
          <div className="flex items-start gap-3">
            <span className="text-[20px]">💡</span>
            <div>
              <div className="font-semibold text-[13.5px] mb-1.5">Khuyến nghị cho Team Digital Marketing</div>
              <p className="text-[12.5px] text-slate-700 leading-relaxed">
                Với vai trò leader team Digital, anh có thể tập trung vào 3 đòn bẩy chính: <strong>(1) Geo-targeting tăng traffic</strong> cho các CH nhóm B5/B6 thiếu khách,
                <strong> (2) Retargeting</strong> & <strong>remarketing</strong> cho các CH nhóm B3/B4 chốt đơn yếu (data Pixel + Zalo OA), và
                <strong> (3) Content + KOC địa phương</strong> cho các CH cần phục hồi hình ảnh.
                Phối hợp Trade Marketing để đồng bộ POSM, combo và Content team cho asset campaign cuối tháng.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};
// =================
// APP CHÍNH
// =================
const App = () => {
  const [activeTab, setActiveTab] = useState('overview');
  const data = window.DASHBOARD_DATA;
  if (!data) return <div style={{padding:60, textAlign:'center'}}>Lỗi tải dữ liệu</div>;

  const tabs = [
    {id:'overview', label:'Tổng quan', icon:<IconChart size={14}/>},
    {id:'forecast', label:'Dự báo', icon:<IconCrystalBall size={14}/>},
    {id:'detail', label:'Khu vực & Cửa hàng', icon:<IconMap size={14}/>},
    {id:'ranking', label:'Xếp hạng', icon:<IconTrophy size={14}/>},
    {id:'insight', label:'Nhận định & Đề xuất', icon:<IconLightbulb size={14}/>},
  ];

  return (
    <div style={{maxWidth:1440, margin:'0 auto', padding:'24px 28px 60px 28px'}}>
      {/* Header */}
      <div className="surface-elevated p-5 mb-5 fadeup">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <div className="flex items-center gap-3">
              <div style={{width:46, height:46, borderRadius:14,
                  background:'linear-gradient(135deg, #5b8def 0%, #b89cf0 60%, #ed9ebe 100%)',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  color:'white', fontWeight:800, fontFamily:'Plus Jakarta Sans', fontSize:18,
                  boxShadow:'0 6px 20px rgba(91,141,239,0.3)'}}>G</div>
              <div>
                <h1 className="display-font shimmer-text" style={{fontSize:24, fontWeight:800, margin:0}}>GUMAC CRM Dashboard</h1>
                <div className="text-[12.5px] text-slate-500 mt-0.5">Tổng quan kinh doanh tháng {data.meta.month}/{data.meta.year} • Cập nhật đến {data.meta.data_through}</div>
              </div>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="text-right">
              <div className="text-[11px] text-slate-500 uppercase font-semibold tracking-wider">Doanh thu lũy kế</div>
              <div className="ticker display-font font-bold text-[20px]" style={{color:'var(--pastel-blue-deep)'}}>{fmtCurrency(data.overview.total_dt_dat)}</div>
            </div>
            <div className="h-10 w-px bg-slate-200"></div>
            <div className="text-right">
              <div className="text-[11px] text-slate-500 uppercase font-semibold tracking-wider">% Mục tiêu</div>
              <div className="ticker display-font font-bold text-[20px]" style={{color: colorByPct(data.overview.pct_full)}}>{fmtPct(data.overview.pct_full)}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div className="glass" style={{padding:6, borderRadius:18, marginBottom:18, display:'inline-flex', flexWrap:'wrap', gap:4}}>
        {tabs.map(t => (
          <button key={t.id} className={`nav-pill ${activeTab===t.id?'active':''}`} onClick={()=>setActiveTab(t.id)}>
            <span style={{display:'inline-flex',alignItems:'center',gap:6}}>{t.icon} {t.label}</span>
          </button>
        ))}
      </div>

      {/* Content */}
      <div>
        {activeTab === 'overview' && <Section1 data={data}/>}
        {activeTab === 'forecast' && <Section2 data={data}/>}
        {activeTab === 'detail' && <Section3 data={data}/>}
        {activeTab === 'ranking' && <Section4 data={data}/>}
        {activeTab === 'insight' && <Section5 data={data}/>}
      </div>

      {/* Footer */}
      <div className="mt-10 text-center">
        <div className="text-[11px] text-slate-400">
          GUMAC Digital Team • Dashboard CRM • Dữ liệu Offline {data.meta.month}/{data.meta.year}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
